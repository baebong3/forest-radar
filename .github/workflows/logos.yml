name: fetch-logos
on:
  push:
    branches: [main]
    paths: ['tools/fetch_logos.py', '.github/workflows/logos.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fetch_logos.py
      - run: |
          git config user.name  "forest-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "logos: 후보 수집" || echo none
          git pull --rebase -q origin main && git push
