name: daily-radar

on:
  schedule:
    - cron: '0 22 * * *'      # 매일 07:00 KST
  push:                       # 코드 수정이 올라오면 바로 한 번 실행
    branches: [main]
    paths: ['radar/**', 'data/production.csv', '.github/workflows/daily.yml', 'trigger.txt']
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      days:
        description: '뉴스 수집 기간(일) - 평소 3, 과거 보충은 30'
        default: '3'
      start:
        description: '수출입 백필 시작 연월(자료가 없는 품목만 적용)'
        default: '2016-01'

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect news
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: python radar/collect_news.py --days ${{ github.event.inputs.days || '3' }}

      - name: Collect trade (관세청)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python radar/collect_trade.py --start ${{ github.event.inputs.start || '2016-01' }}

      - name: Collect KREI 임업관측
        run: python radar/collect_krei.py

      - name: Collect 임산물생산조사 (연 1회 공표분)
        run: |
          sudo apt-get install -y -q poppler-utils > /dev/null
          python radar/collect_prod.py

      - name: Build page
        run: python radar/build.py

      - name: Commit
        run: |
          git config user.name  "forest-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.db docs/index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "radar: $(TZ=Asia/Seoul date +%Y-%m-%d) 자동 갱신"
            git pull --rebase -q origin main && git push
          fi
