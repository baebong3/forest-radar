name: dump-prod-txt
on:
  push:
    branches: [main]
    paths: ['radar/dump_prod_txt.py', '.github/workflows/dump.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get install -y -q poppler-utils > /dev/null && python radar/dump_prod_txt.py 2020 2021 2022 2023 2024
      - run: |
          git config user.name "forest-radar-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/prod_txt && git commit -m "생산조사 보고서 텍스트 보관" && git pull --rebase -q origin main && git push || echo 변경없음
