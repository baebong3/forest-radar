name: probe-krei
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/probe_krei.py
      - run: |
          git config user.name  "forest-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "probe: KREI 게시판 구조 점검" || echo none
          git push
