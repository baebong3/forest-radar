name: probe
on:
  push:
    branches: [main]
    paths: ['radar/probe_kfss.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python radar/probe_kfss.py || true
      - run: |
          git config user.name "forest-radar-bot"; git config user.email "actions@users.noreply.github.com"
          git add -f data/probe_kfss.txt && git commit -m "probe kfss" && git pull --rebase -q origin main && git push || echo none
