name: probe
on:
  push:
    branches: [main]
    paths: ['tools/probe_*.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pdfplumber openpyxl xlrd && sudo apt-get install -y -q poppler-utils >/dev/null
      - run: for f in tools/probe_*.py; do python "$f" || true; done
      - run: |
          git config user.name  "forest-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "probe" || echo none
          git pull --rebase -q origin main && git push
